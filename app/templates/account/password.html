{% extends "base.html" %}
{% block content %}
<div class="login-card card">
  <h1>تغيير كلمة المرور</h1>
  {% if user.must_change_password %}
  <p class="muted">كلمة مرورك الحالية مؤقتة. اختر كلمة مرور جديدة للمتابعة.</p>
  {% endif %}
  {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
  <form method="post" class="stack">
    <label>كلمة المرور الحالية
      <input name="current" type="password" autocomplete="current-password" required dir="ltr">
    </label>
    <label>كلمة المرور الجديدة
      <input name="new" type="password" minlength="8" autocomplete="new-password" required dir="ltr" data-rules>
    </label>
    <label>أعد كتابة كلمة المرور الجديدة
      <input name="confirm" type="password" minlength="8" autocomplete="new-password" required dir="ltr">
    </label>
    <button type="submit" class="btn btn-primary">حفظ</button>
  </form>
</div>
{% endblock %}
