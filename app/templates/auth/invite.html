{% extends "base.html" %}
{% block title %}إنشاء حساب مراجع — مفتاح الخزينة{% endblock %}
{% block content %}
<div class="login-card card wide">
  <h1>🔑 إنشاء حساب مراجع</h1>
  <p class="muted">دُعيت مراجعًا لسياسات التقسيم. اختر كلمة مرورك لتفعيل حسابك.</p>
  {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
  <form method="post" action="/invite" class="stack">
    <input type="hidden" name="token" value="{{ token }}">
    <label>الاسم الكامل
      <input name="full_name" value="{{ (invitee.full_name if invitee else '') | keep }}" autocomplete="name" required>
    </label>
    <label>البريد الإلكتروني
      <input value="{{ invitee.email if invitee else '' }}" type="email" dir="ltr" readonly>
      <small class="muted">ستسجّل الدخول بهذا البريد</small>
    </label>
    <label>كلمة المرور
      <input name="password" type="password" minlength="8" dir="ltr" autocomplete="new-password" required data-rules>
    </label>
    <button class="btn btn-primary" type="submit">إنشاء الحساب</button>
  </form>
</div>
{% endblock %}
