{% macro company_fields(v, readonly=false) %}
<div class="form-grid">
  <label>اسم الشركة *
    <input name="name" value="{{ v.name or '' }}" required {{ 'readonly' if readonly }}>
  </label>
  <label>السجل التجاري
    <input name="cr_number" value="{{ v.cr_number or '' }}" dir="ltr" {{ 'readonly' if readonly }}>
  </label>
  <label>الرقم الضريبي
    <input name="vat_number" value="{{ v.vat_number or '' }}" dir="ltr" {{ 'readonly' if readonly }}>
  </label>
  <label>مسؤول التواصل
    <input name="contact_name" value="{{ v.contact_name or '' }}" {{ 'readonly' if readonly }}>
  </label>
  <label>جوال التواصل
    <input name="contact_phone" value="{{ v.contact_phone or '' }}" dir="ltr" {{ 'readonly' if readonly }}>
  </label>
</div>
{% endmacro %}

{% macro reviewer_fields(v) %}
<div class="form-grid">
  <label>اسم المراجع *
    <input name="reviewer_full_name" value="{{ v.reviewer_full_name or '' }}" required>
  </label>
  <label>بريد المراجع الإلكتروني *
    <input name="reviewer_email" type="email" value="{{ v.reviewer_email or '' }}" dir="ltr" required>
    <small class="muted">يصله رابط دعوة يختار منه كلمة مروره بنفسه، ويسجّل الدخول ببريده</small>
  </label>
</div>
{% endmacro %}
