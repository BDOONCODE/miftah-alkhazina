# Render deployment (free plan). Full steps in DEPLOY.md
services:
  - type: web
    name: miftah-alkhazina
    runtime: python
    plan: free
    region: frankfurt  # closest region to Saudi Arabia, same region as the Supabase database
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      alembic upgrade head &&
      python -m app.cli bootstrap &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL  # Supabase Session pooler URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: HTTPS_ONLY_COOKIES
        value: "1"
      - key: ADMIN_USERNAME  # first admin account
        sync: false
      - key: ADMIN_PASSWORD  # temporary; must be changed on first login
        sync: false
      - key: DEMO_SEED  # 1 = demo company with a policy and transactions
        value: "1"
      - key: DEMO_PASSWORD  # password for the demo-acc and demo-rev2 accounts
        sync: false
      - key: APP_URL  # site URL used in emails
        value: https://miftah-alkhazina.onrender.com
      - key: BREVO_API_KEY  # Brevo key for confirmation emails (free)
        sync: false
      - key: MAIL_FROM  # verified sender address in Brevo
        sync: false
      - key: BANK_WEBHOOK_SECRET  # signing secret for bank notifications (given to Neotek at integration)
        generateValue: true
