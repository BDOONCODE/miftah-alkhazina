# يبقي الموقع صاحي: الاستضافة المجانية (Render) تنوّم الموقع بعد ١٥ دقيقة بدون زيارات،
# وأول زيارة بعدها تاخذ قرابة دقيقة. هذا يزوره كل ٥ دقائق، ويشغّل معه صرف البنود اللي وصل موعدها.
name: keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: زيارة الموقع
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 90 https://miftah-alkhazina.onrender.com/keepalive
