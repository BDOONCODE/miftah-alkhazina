# Keeps the site awake: Render's free plan sleeps the service after 15 idle minutes,
# and the first visit after that takes about a minute. This visits it every 5 minutes (and runs due payouts).
name: keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Visit the site
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 90 https://miftah-alkhazina.onrender.com/keepalive
